<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOYHUB — Platform Website Multi-Cabang & Franchise Toko Mainan Indonesia</title>
  <meta name="description" content="Satu sistem website terpusat untuk ratusan cabang toko mainan, franchise hobby, and jaringan kids store Indonesia. Integrasi katalog SKU mainan, stok cabang real-time, dan router WhatsApp lokal." />
  
  <!-- Favicon: Modern 3D Toy Brick Cube -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ef4444'><path d='M21 16.5l-9 5.2-9-5.2V7.5l9-5.2 9 5.2v9z'/><circle cx='12' cy='7' r='2' fill='%23ffffff'/><circle cx='7' cy='15' r='1.5' fill='%23ffffff'/><circle cx='17' cy='15' r='1.5' fill='%23ffffff'/></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <script>
    // Disable browser scroll restoration so refresh always starts at top
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    window.scrollTo(0, 0);
    window.addEventListener('beforeunload', function () {
      window.scrollTo(0, 0);
    });
    window.addEventListener('load', function () {
      window.scrollTo(0, 0);
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
